%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: Cuttlefish
whoAmI: 1403
firmwareVersion: "0.1"
hardwareTargets: "0.0"
registers:
  PinDirection: &IORegister
    address: 32
    type: U8
    access: Write
    maskType: Pins
    description: "Set the direction of the pins. 0 = input; 1 = output"
  PinState:
    <<: *IORegister
    address: 33
    description: "Read or write the state of the pins."
  PinSet:
    <<: *IORegister
    address: 34
    description: "Set pins specified in the mask to logic HIGH by setting the
                  corresponding bit."
  PinClear:
    <<: *IORegister
    address: 35
    description: "Set specified pins in the mask to logic LOW by setting the
                  corresponding bit."
  EnableRisingEdgeEvents:
    <<: *IORegister
    address: 36
    description: "Enable Events from the RisingEdgeEvents register for the
                  specified pins in the mask when any of the corresponding
                  pins transitions from logic LOW to logic HIGH."
  RisingEdgeEvents:
    <<: *IORegister
    address: 37
    access: Event
    description: "Event Only. Returns a timestamped message with the Port state
                  when any of the pins specified in the EnableRisingEdgeEvents
                  register transitions from logic LOW to logic HIGH. For
                  pins configured with PwmSettings or AnalogPwmSettings,
                  events are produced from the scheduled output changes
                  (for AnalogPwmSettings, the nominal output rather than
                  every edge of the high-frequency output)."
  EnableFallingEdgeEvents:
    <<: *IORegister
    address: 38
    description: "Enable Events from the FallingEdgeEvents register for the
                  specified pins in the mask when any of the corresponding
                  pins transitions from logic HIGH to logic LOW."
  FallingEdgeEvents:
    <<: *IORegister
    address: 39
    access: Event
    description: "Event Only. Returns a timestamped message with the Port state
                  when any of the pins specified in the EnableFallingEdgeEvents
                  register transitions from logic HIGH to logic LOW. For
                  pins configured with PwmSettings or AnalogPwmSettings,
                  events are produced from the scheduled output changes
                  (for AnalogPwmSettings, the nominal output rather than
                  every edge of the high-frequency output)."
  PwmState:
    address: 40
    access: [Write, Event]
    type: U8
    maskType: EnableFlag
    description: "Write a nonzero value to this register to start the PWM
                  schedule. Write zero to stop the schedule. Receive an
                  event with payload=0 when the pwm schedule has finished."
  PwmSettings0: &PwmSettingsRegister
    address: 41
    type: U8
    access: Write
    length: 17
    description: "Configure the settings of the PWM output on pin 0."
    interfaceType: PwmSettingsPayload
    payloadSpec:
      OffsetUs:
        offset: 0
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains LOW before
                      switching HIGH in one period."
      OnDurationUs:
        offset: 4
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains HIGH in one
                      period."
      OffDurationUs:
        offset: 8
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains LOW in one
                      period."
      Cycles:
        offset: 12
        length: 4
        interfaceType: uint
        description: "How many pulses to produce, or zero to pulse until
                      disabled."
      Invert:
        offset: 16
        interfaceType: bool
        description: "Whether the output is inverted (on-time refers to the
                      output being LOW instead)."
  PwmSettings1:
    <<: *PwmSettingsRegister
    address: 42
    description: "Configure the settings of the PWM output on pin 1."
  PwmSettings2:
    <<: *PwmSettingsRegister
    address: 43
    description: "Configure the settings of the PWM output on pin 2."
  PwmSettings3:
    <<: *PwmSettingsRegister
    address: 44
    description: "Configure the settings of the PWM output on pin 3."
  PwmSettings4:
    <<: *PwmSettingsRegister
    address: 45
    description: "Configure the settings of the PWM output on pin 4."
  PwmSettings5:
    <<: *PwmSettingsRegister
    address: 46
    description: "Configure the settings of the PWM output on pin 5."
  PwmSettings6:
    <<: *PwmSettingsRegister
    address: 47
    description: "Configure the settings of the PWM output on pin 6."
  PwmSettings7:
    <<: *PwmSettingsRegister
    address: 48
    description: "Configure the settings of the PWM output on pin 7."
  AnalogPwmSettings0: &AnalogPwmSettingsRegister
    address: 49
    type: U8
    access: Write
    length: 25
    description: "Configure the settings of an analog PWM output on pin 0.
                  The output follows the same nominal waveform as PwmSettings0,
                  but, while the nominal output is HIGH, the pin produces a
                  high-frequency PWM signal with the specified frequency and
                  duty cycle. Writing this register replaces any settings
                  previously written to PwmSettings0 (and vice versa). Pins
                  0-1, 2-3, 4-5, and 6-7 share a hardware PWM peripheral; the
                  analog outputs on a shared pair must use the same frequency."
    interfaceType: AnalogPwmSettingsPayload
    payloadSpec:
      OffsetUs:
        offset: 0
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains LOW before
                      switching HIGH in one period."
      OnDurationUs:
        offset: 4
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains HIGH in one
                      period."
      OffDurationUs:
        offset: 8
        length: 4
        interfaceType: uint
        description: "How long (in microseconds) the output remains LOW in one
                      period."
      Cycles:
        offset: 12
        length: 4
        interfaceType: uint
        description: "How many pulses to produce, or zero to pulse until
                      disabled."
      Invert:
        offset: 16
        interfaceType: bool
        description: "Whether the output is inverted (on-time refers to the
                      output being LOW instead)."
      AnalogFrequencyHz:
        offset: 17
        length: 4
        interfaceType: float
        description: "Frequency (in Hz) of the high-frequency PWM output
                      produced while the nominal output is HIGH. Valid range:
                      10Hz to 1MHz (recommended: 1KHz to 100KHz)."
      AnalogDutyCycle:
        offset: 21
        length: 4
        interfaceType: float
        description: "Duty cycle (0.0 to 1.0) of the high-frequency PWM output
                      produced while the nominal output is HIGH."
  AnalogPwmSettings1:
    <<: *AnalogPwmSettingsRegister
    address: 50
    description: "Configure the settings of an analog PWM output on pin 1.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings2:
    <<: *AnalogPwmSettingsRegister
    address: 51
    description: "Configure the settings of an analog PWM output on pin 2.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings3:
    <<: *AnalogPwmSettingsRegister
    address: 52
    description: "Configure the settings of an analog PWM output on pin 3.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings4:
    <<: *AnalogPwmSettingsRegister
    address: 53
    description: "Configure the settings of an analog PWM output on pin 4.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings5:
    <<: *AnalogPwmSettingsRegister
    address: 54
    description: "Configure the settings of an analog PWM output on pin 5.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings6:
    <<: *AnalogPwmSettingsRegister
    address: 55
    description: "Configure the settings of an analog PWM output on pin 6.
                  See AnalogPwmSettings0 for details."
  AnalogPwmSettings7:
    <<: *AnalogPwmSettingsRegister
    address: 56
    description: "Configure the settings of an analog PWM output on pin 7.
                  See AnalogPwmSettings0 for details."
  ScheduleStatus:
    address: 57
    access: Event
    type: U8
    description: "Event Only. Emitted when the PWM schedule encounters an
                  error while running. A value of 1 indicates a missed
                  deadline, after which the schedule is aborted."

bitMasks:
  Pins:
    description: "Available pins on the device"
    bits:
      None: 0x0
      Pin0: 0x1
      Pin1: 0x2
      Pin2: 0x4
      Pin3: 0x8
      Pin4: 0x10
      Pin5: 0x20
      Pin6: 0x40
      Pin7: 0x80
