[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harp-device-cuttlefish"
version = "0.1.0"
description = "Python interface for the Harp Cuttlefish device."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["harp-python", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/harp"]
